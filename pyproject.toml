[project]
name = "trading-bot"
version = "2.0.0"
description = "High-frequency cryptocurrency scalping bot with momentum-based strategy"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Trading Bot Team"}
]
keywords = ["trading", "cryptocurrency", "scalping", "binance", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "python-binance==1.0.32",
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.3.5,<3.0.0",
    "TA-Lib==0.6.8",
    "PyYAML==6.0.2",
    "structlog>=25.5.0",
    "dash>=3.3.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.27.0",
    "waitress>=3.0.2",
    "aiosqlite==0.21.0",
    "sqlalchemy==2.0.44",
    "aiofiles==24.1.0",
    "psutil==7.1.3",
    "tenacity>=9.0.0",
    "mcp>=1.3.2",
    "fastmcp>=2.0.0",
    "pydantic>=2.11.1",
    "python-dotenv>=1.0.2",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.6",
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "black==25.1.0",
    "mypy==1.18.2",
]
build = [
    "setuptools>=75.8.0,<81.0.0",
    "wheel>=0.45.1",
]

[build-system]
requires = ["setuptools>=75.8.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "config*", "data*", "database*", "infrastructure*", "monitoring*", "services*", "shared*", "utils*"]
exclude = ["tests*", "docs*", "scripts*", "logs*", "venv*", "mcp_server*", "bug_hunter*"]

[dependency-groups]
dev = [
    "ruff==0.14.6",
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "black==25.1.0",
    "mypy==1.18.2",
    "radon>=6.0.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | venv
  | .mypy_cache
  | .pytest_cache
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    "venv",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv",
    ".mypy_cache",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
